[project]
name = "browserfleet-workspace"
version = "0.1.0"
description = "BrowserFleet Python workspace and shared development tooling."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "workers/agent"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "workers/agent/tests"]
python_files = ["test_*.py"]
pythonpath = ["apps/api"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["apps/api", "workers/agent"]
exclude = ["**/__pycache__", ".venv"]
